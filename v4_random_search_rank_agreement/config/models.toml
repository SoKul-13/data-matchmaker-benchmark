# ---------------------------------------------------------------- xAI (key present, no credits -> buy at console.x.ai, set enabled = true)
[[model]]
name = "grok-4"
enabled = false
provider = "openai_compat"
model_id = "grok-4"
base_url = "https://api.x.ai/v1"
api_key_env = "XAI_API_KEY"
price_in = 3.00
price_out = 15.00
tier = "flagship"
concurrency = 4

# ---------------------------------------------------------------- Meta Llama 3.3 70B (open-weight flagship). Groq free tier, or Together (paid)
