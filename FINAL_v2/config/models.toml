# ---------------------------------------------------------------- FREE ROUTE: Mistral Experiment plan (console.mistral.ai; phone verification, no card; ~1B tokens/month;
# Mistral may use free-tier traffic for training, acceptable for public benchmark prompts). mistral-large is NOT in the free tier (403 tier_not_allowed),
# so the entry is Mistral Medium 3, their standard tier. A 429 'Rate limit exceeded' on every call means the Experiment plan is not yet activated in the console.
[[model]]
name = "mistral-medium"
provider = "openai_compat"
model_id = "mistral-medium-latest"
base_url = "https://api.mistral.ai/v1"
api_key_env = "MISTRAL_API_KEY"
price_in = 0.0
price_out = 0.0
tier = "mid"
free_tier = true
rpm = 30
concurrency = 1
